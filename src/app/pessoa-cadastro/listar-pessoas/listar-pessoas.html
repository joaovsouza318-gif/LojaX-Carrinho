<div id="div-listar">
    <h2>Listar Pessoas</h2>

    <div id="listar-pessoas">
        @for (elem of listarPessoas(); track elem.idpessoa){
          <div class="item-pessoa">
            <span class="dados-pessoas">
                {{elem.idpessoa}} - {{elem.nome}} - {{elem.cpf}} - {{calcIdade(elem.data_nascimento)}} anos - {{elem.sexo}} - {{elem.telefone}} - {{elem.email}}
            </span>

            <span class="lnks-lista">
                <a class="lnk-editar" (click)="buscarPessoas(elem)"> Editar </a>
                
                <a class="lnk-excluir" (click)="excluirPessoa(elem)"> Excluir </a>
            </span>
          </div>
        }@empty{
            <div class=" div-pessoas">
                NENHUM REGISTRO NA LISTA
            </div>
        }
        
    </div>

</div>
