<div id="cadastro">

    <h1>Cadastro</h1>

    <form id="pessoa-form" (ngSubmit)="enviaDados()" ngNativeValidate>

        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" maxlength="70" [(ngModel)]="nome" required>

        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" maxlength="11" [(ngModel)]="cpf" required>

        <label for="data_nascimento">Data de Nascimento</label>
        <input type="date" [(ngModel)]="data_nascimento" required>

        <label>Sexo</label>
        <input type="radio" name="sexo" id="sexoM" class="btnSelecao" value="M" [(ngModel)]="sexo" required> Masculino
        <input type="radio" name="sexo" id="sexoF" class="btnSelecao" value="F" [(ngModel)]="sexo" required> Feminino
        <input type="radio" name="sexo" id="sexoN" class="btnSelecao" value="N" [(ngModel)]="sexo" required> Não se Identificar

        <label for="telefone">Telefone</label>
        <input type="text" id="telefone" name="telefone" maxlength="11" [(ngModel)]="telefone" required>

        <label for="email">Email</label>
        <input type="text" id="email" name="email" maxlength="120" [(ngModel)]="email" required>

        <label for="senha">Senha</label>
        <input type="password" name="senha" id="senha" maxlength="150" [(ngModel)]="senha" required>

        <div id="div-btns">
            <button type="submit">{{editar ? "Salvar Alterações" : "Cadastrar"}}</button>
            <button type="reset">Limpar</button>
        </div>

    </form>
</div>
